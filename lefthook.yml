pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,tsx,mts}"
      run: node scripts/expand-returned-objects.js {staged_files} && pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    biome:
      glob: "*.{json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

commit-msg:
  commands:
    conventional:
      run: pnpm exec commitlint --edit {1}
    no-ai-attribution:
      run: "! grep -iqE 'co-authored-by|claude|opus|anthropic|generated with' {1} || (echo 'Commit messages carry no co-author or AI attribution trailers.' && exit 1)"
