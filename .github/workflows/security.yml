# Known-vulnerable dependencies and leaked secrets. Runs on every PR and push, and weekly so a new advisory against a
# dependency already in the lockfile is caught without a code change. CodeQL, Scorecard and dependency review run
# in their own workflows.
name: Security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reads the lockfile only, so nothing is installed. Ignored advisories live in pnpm-workspace.yaml (auditConfig).
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level high

  # Scans the commits a PR or push adds (the whole history otherwise) for credentials, checking live ones against
  # their provider. GitHub secret scanning with push protection is the first line; this catches what it doesn't know.
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --results=verified,unknown
