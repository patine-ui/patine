name: Release

# release-please reads the Conventional Commits on master and keeps a "chore(release)" PR open with the
# version bump and CHANGELOG. Merging that PR tags the release, creates the GitHub release, publishes to
# npm (patine-ui, @patine-ui/icons and @patine-ui/mcp) and redeploys the docs so the new version shows up in the
# version dropdown.
on:
  push:
    branches: [master]
  # Publishes a release whose publish failed: run it from master and name the tag. It still waits for the `npm` approval.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (v0.2.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Opens and updates the release PR, tags the release and creates the GitHub release.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      # The package lives in packages/ui, so release-please names its output by that path; the bare
      # `release_created` is only set for a package at the repo root.
      release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Builds and checks the tarball with read-only access: lint and tests run hundreds of dev dependencies, so none
  # of them ever sees the npm publishing token.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # A re-publish builds a release tag only, never a branch or a pull request's head.
      - name: Check the tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in the release path: a poisoned cache entry can't reach what gets published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Ships the docs in the package so agents read the API offline. The docs site is built from the private repo
      # and deployed before a release, so its copy matches this version.
      - run: pnpm build:llms
      # The docs come from the live site, not from a reviewed commit: show their hash so the `npm` approver can match it
      # with the one the site's deploy printed.
      - name: Docs hash
        run: echo "llms-full.txt sha256 $(sha256sum packages/ui/llms-full.txt | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      # npm shows the package's README and LICENSE; the repo keeps one copy at the root.
      - run: cp README.md LICENSE packages/ui/
      - run: node packages/ui/scripts/check-pack.js
      # @patine-ui/icons (built against the patine-ui just built) and @patine-ui/mcp ship with every release, at
      # patine-ui's version: one version for the kit, so the MCP server's docs and the icons match the library.
      - run: pnpm --filter @patine-ui/icons build
      - run: node packages/ui/scripts/check-pack.js packages/icons
      - run: node packages/ui/scripts/check-pack.js packages/mcp
      - name: Version icons and mcp as patine-ui
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          for pkg in icons mcp; do (cd "packages/$pkg" && npm pkg set version="$version"); done
      # npm pack doesn't create the destination folder.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          for pkg in ui icons mcp; do
            (cd "packages/$pkg" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 5

  # The only job that can publish: no checkout, no install, no project code. It uploads the tarball built above
  # through npm Trusted Publishing (OIDC, no stored token), which also attaches provenance.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Give the `npm` environment a required reviewer and name it in npm's Trusted Publisher settings: then every
    # publish waits for a click, and no other workflow or job can publish even with id-token access.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24 ships npm 11, which npm Trusted Publishing requires.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      # The ./ matters: npm reads `package/x.tgz` as a GitHub repo shorthand. A version already on npm is skipped, so a
      # re-run after a partial publish finishes the rest. Each package needs this workflow as its Trusted Publisher.
      - name: Publish
        run: |
          for tgz in package/*.tgz; do
            id=$(tar -xOzf "$tgz" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0)); p.name + '@' + p.version")
            if npm view "$id" version > /dev/null 2>&1; then echo "$id is already on npm"; continue; fi
            npm publish "./$tgz" --ignore-scripts --access public
          done
